  - aid: sapienza-university-of-rome:rosa-oai-pmh
    name: Riviste Online SApienza (R.O.SA) OAI-PMH
    x-operator: institution
    description: >-
      Site-wide OAI-PMH 2.0 provider over Riviste Online SApienza, the university's
      open-access journal publishing platform, hosted on its own domain at
      rosa.uniroma1.it. Verified live 2026-09-01 — the index-level endpoint
      https://rosa.uniroma1.it/rosa04/index/oai?verb=Identify returns 200
      text/xml with repositoryName "Riviste Online SApienza - R.O.SA - 4",
      repositoryIdentifier rosa.uniroma1.it, earliestDatestamp 2011-04-02T10:34:31Z,
      compression gzip/deflate, and a toolkit description naming Open Journal
      Systems 3.3.0.13 (Public Knowledge Project). verb=ListSets returns 100 sets,
      one per journal or journal section. Per-journal endpoints are also live, e.g.
      https://rosa.uniroma1.it/rosa04/annali_di_botanica/oai?verb=Identify (200,
      repositoryName "Annali di Botanica", adminEmail
      annalidibotanica@uniroma1.it). The OJS REST API v1 exists on the same host
      but is closed to anonymous callers:
      /rosa04/annali_di_botanica/api/v1/issues returns 403 application/json
      {"error":"api.403.unauthorized"}. OJS is PKP software, so the API contract is
      PKP's and none is saved here; the deployment, the host and the journals are
      Sapienza's. The rosa.uniroma1.it root is a soft-404 catch-all — every unknown
      path returns the 68KB landing page — so the live surface is only reachable
      under the /rosa04/ base.
    humanURL: https://rosa.uniroma1.it/
    baseURL: https://rosa.uniroma1.it/rosa04/index/oai
    tags: [ Open Access, Scholarly Publishing, OAI-PMH, OJS, Journals ]
    properties:
      - type: Documentation
        url: https://www.openarchives.org/OAI/openarchivesprotocol.html
      - type: Conformance
        url: conformance/sapienza-university-of-rome-conformance.yml
