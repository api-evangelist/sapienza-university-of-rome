        url: authentication/sapienza-university-of-rome-authentication.yml
  - aid: sapienza-university-of-rome:identity-federation
    name: Sapienza Shibboleth Identity Provider (IDEM GARR AAI)
    x-operator: federation
    description: >-
      Institution-operated Shibboleth SAML 2.0 identity provider, published as
      machine-readable metadata both directly on the institution's own host and in
      the IDEM GARR AAI federation aggregate. Verified live 2026-09-01 —
      https://idp.uniroma1.it/idp/shibboleth returns 200 with an EntitiesDescriptor
      named urn:mace:shibboleth:uniroma1.it:uniroma1-prod-IDP containing
      EntityDescriptor entityID="https://idp.uniroma1.it/idp/shibboleth", an
      IDPSSODescriptor with protocolSupportEnumeration
      urn:oasis:names:tc:SAML:2.0:protocol, shibmd:Scope "uniroma1.it" and
      mdui:DisplayName "Sapienza Università di Roma" / "Sapienza University of
      Rome". The same entityID is present in the IDEM GARR federation aggregate
      https://md.idem.garr.it/metadata/idem-metadata-sha256.xml (200, 3,054,701
      bytes, fetched 2026-09-01). A federation is shared by definition, and the IdP
      behind it is the institution's own — this is recorded as the institution's
      relationship, not as anyone's contract. It is the strongest machine-readable
      institution-operated surface Sapienza has and it was absent from the June
      2026 profile.
    humanURL: https://idem.garr.it/
    baseURL: https://idp.uniroma1.it/idp/shibboleth
    tags: [ Identity Federation, SAML, Shibboleth, Single Sign-On, IDEM GARR ]
    properties:
      - type: Documentation
        url: https://idem.garr.it/
      - type: Conformance
        url: conformance/sapienza-university-of-rome-conformance.yml
  - aid: sapienza-university-of-rome:library-open-data
    name: Sapienza Library System Open Data & Linked Data (dormant)
    x-operator: institution
    description: >-
      Open-data and linked-data publishing project of the Sistema Bibliotecario
      Sapienza, on the institution's own host sbs.uniroma1.it, documenting library
      and digital-resource datasets under CC BY 4.0 against the 5-star open data
      model and a DCAT-AP_IT profile. The catalogue pages are live and distinct —
      /data/opendata/ (200), /data/opendata/itrousr-od_2016-Lib_Info (200),
      /data/opendata/itrousr-od_2017-SDL_2013 (200),
      /data/opendata/itrousr-od_2017-SimonLib_2015 (200), /data/vocabulary (200) —
      but the surface does NOT deliver machine-readable data as previously
      recorded here. The single dataset download link on the site,
      https://sbs.uniroma1.it/openDataSets/od_2017/itrousr-od_2017-SimonLib_2015_csv.zip,
      returns a hard 404; the linked-data page states in its own words "Linked data
      access website — This website is still under development"; there is no SPARQL
      endpoint (every unknown path under /data/ is a soft-404 returning the same
      6,761-byte landing page, including /data/sparql and /data/catalogo); and the
      catalogue is dated January 2017 with a 2019 copyright. Recorded as a real but
      dormant institutional open-data effort rather than as a callable API.
    humanURL: https://sbs.uniroma1.it/data/opendata/
    tags: [ Open Data, Linked Data, Library, DCAT, CC-BY ]
    properties:
      - type: Documentation
        url: https://sbs.uniroma1.it/data/opendata/
      - type: LinkedData
        url: https://sbs.uniroma1.it/data/linkeddata
