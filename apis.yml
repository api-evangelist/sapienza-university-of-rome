aid: sapienza-university-of-rome
name: Sapienza University of Rome
x-type: university
x-category: Public Research University
description: >-
  Sapienza University of Rome (Sapienza Università di Roma) is Italy's largest
  university, a public research institution founded in 1303 and ranked #132 in
  the QS World University Rankings 2025. It runs no public developer portal, no
  API gateway and publishes no OpenAPI, and this profile does not pretend
  otherwise. What it does operate, on its own uniroma1.it hosts, are three
  genuinely institution-run machine surfaces: an OAI-PMH 2.0 provider on the
  IRIS institutional research catalogue (iris.uniroma1.it, DSpace-CRIS supplied
  by CINECA) whose underlying DSpace REST API is closed behind HTTP basic auth;
  a second, site-wide OAI-PMH 2.0 provider over the 100 open-access journals of
  Riviste Online SApienza (rosa.uniroma1.it, Open Journal Systems 3.3.0.13),
  whose OJS REST API v1 answers 403 to anonymous callers; and a Shibboleth SAML
  2.0 identity provider, entityID https://idp.uniroma1.it/idp/shibboleth,
  published as machine-readable metadata in the IDEM GARR AAI federation
  aggregate. Its DataCite registration (provider ROMAUNO, repository
  CRUI.UNIROMA1, prefix 10.13133, 8,051 DOIs), its Crossref membership (member
  13551, prefix 10.53131) and its ROR identifier 02be6w209 are verifiable from
  public registry endpoints. The Sapienza Library System open-data project at
  sbs.uniroma1.it documents a 5-star / DCAT-AP_IT dataset catalogue, but its one
  dataset download link is a hard 404 and its linked-data service still says
  "this website is still under development" — the project has not been updated
  since 2017 and it is recorded here honestly rather than credited as a live
  open-data API. The library OPAC runs vendor Sebina software on an institution
  host with no public API, the course catalogue is a Drupal site with no data
  interface, and there is no official institutional GitHub organization: the
  Sapienza-named org on GitHub carries student coursework, not platform code.
