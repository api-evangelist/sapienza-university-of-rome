x-coverage:
  state: covered
  reason: covered
  detail: >-
    Three institution-operated machine surfaces were found and verified live on
    2026-09-01 — an OAI-PMH 2.0 provider on the IRIS research catalogue
    (iris.uniroma1.it), a second site-wide OAI-PMH 2.0 provider over 100
    open-access journals on Riviste Online SApienza (rosa.uniroma1.it, OJS
    3.3.0.13), and a Shibboleth SAML 2.0 identity provider published in the IDEM
    GARR AAI federation aggregate — plus four education-regime domain standards
    evidenced from public endpoints (oai-pmh, shibboleth, saml, datacite) and a
    fifth (crossref) from the Crossref member API. Sapienza publishes no OpenAPI,
    no developer portal, no self-service key issuance and no rate-limit or terms
    documentation for any of them, and no contract has been generated to stand in
    for one: DSpace-CRIS (CINECA) and OJS (PKP) contracts are product contracts
    shared by every deployment of that software and belong in the vendors' own
    repos, not here. Two REST surfaces exist on institution hosts and are both
    closed — iris.uniroma1.it/rest/ returns 401 basic-auth, and the OJS
    /api/v1/ endpoints return 403 api.403.unauthorized — recorded in
    authentication/ rather than counted as callable. The Sistema Bibliotecario
    open-data project is documented but dormant: its only dataset download 404s
    and its linked-data service self-declares "still under development". The
    library OPAC is vendor Sebina software on an institution host with no public
    API; the course catalogue is Drupal HTML with no data interface; no
    institutional CKAN, SPARQL, transit, dining or HPC allocation API was found;
    and no official institutional GitHub organization exists. No Figshare, Pure,
    Ex Libris, Symplectic or Dataverse contract was found or added.
