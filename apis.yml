      2012-09-19, isActive true — holding 8,051 DOIs under prefix 10.13133 that
      resolve to Sapienza's own hosts (rosa.uniroma1.it, editricesapienza.it). The
      DataCite API contract belongs to DataCite and is not saved here; the
      membership is Sapienza's and is recorded.
    humanURL: https://commons.datacite.org/repositories/crui.uniroma1
    baseURL: https://api.datacite.org/clients/crui.uniroma1
