apis:
  - aid: sapienza-university-of-rome:iris-oai-pmh
    name: IRIS Research Catalogue OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH 2.0 metadata-harvesting provider for IRIS, Sapienza's institutional
      research information system and repository, served from the university's own
      host iris.uniroma1.it. Verified live 2026-09-01 — verb=Identify returns 200
      text/xml with repositoryName "IRIS - UNIROMA1 - prod", baseURL
      https://iris.uniroma1.it/oai/request, protocolVersion 2.0, adminEmail
      gruppo-pubblicazioni@uniroma1.it, earliestDatestamp 2015-05-04T13:12:45Z,
      deletedRecord transient and granularity YYYY-MM-DDThh:mm:ssZ.
      verb=ListMetadataFormats returns three prefixes — oai_dc, didl (MPEG-21 DIDL)
      and ore (OAI-ORE/Atom). verb=ListSets enumerates the Italian research-product
      typology as community sets (com_11573_784454 "01 Pubblicazione su rivista",
      com_11573_784455 "02 Pubblicazione su volume", com_11573_784456 "03
      Monografia", com_11573_784457 "04 Pubblicazione in atti di convegno" and
      more). verb=ListRecords&metadataPrefix=oai_dc returns real records
      (oai:iris.uniroma1.it:11573/1753388). The platform is DSpace-CRIS supplied to
      the Italian university system by CINECA, so the software contract is the
      vendor's and no spec is saved under this institution — the host, the
      deployment and the research metadata are Sapienza's. The DSpace REST API on
      the same host is NOT open: https://iris.uniroma1.it/rest/ returns
      "HTTP Status 401 - Invalid basic authentication token".
    humanURL: https://www.uniroma1.it/en/pagina/iris-support
    baseURL: https://iris.uniroma1.it/oai/request
    tags: [ Research, Research Repository, OAI-PMH, DSpace, Metadata ]
    properties:
