    interface, JSON export or roster endpoint.
- id: ed-fi
  conforms: false
  operator: none
  evidence: >-
    No Ed-Fi surface. Ed-Fi is a US K-12 / state-education-agency data standard with no adoption in
    the Italian higher-education system; nothing on any probed Sapienza host references it.
- id: caliper
  conforms: false
  operator: none
  evidence: >-
    No IMS Caliper Analytics endpoint or event store is publicly exposed on any uniroma1.it host.
- id: qti
  conforms: false
  operator: none
  evidence: >-
